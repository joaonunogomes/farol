<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232337"/>
      <stop offset="100%" stop-color="#0f0f18"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#89b4fa" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <!-- brass-like blue: light top edge, deeper underside -->
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4d0ff"/>
      <stop offset="45%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#5c8ad8"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a6d8ff"/>
      <stop offset="55%" stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#4a98c4"/>
    </linearGradient>
    <radialGradient id="mouth" cx="40%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#1e2a3a"/>
    </radialGradient>
    <linearGradient id="pennant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9f0b0"/>
      <stop offset="100%" stop-color="#7cc97a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Herald's horn: a herald's trumpet with a hanging pennant, bell pointing up-right, sounding green waves -->
  <!-- background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#glow)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="216" ry="216" fill="none" stroke="#3a3a52" stroke-width="4"/>

  <g transform="rotate(-32 512 512)">
    <!-- shadow under the horn -->
    <path d="M212 538 C330 530, 470 540, 560 540 C650 606, 740 668, 800 672 L800 700 C740 696, 650 632, 560 566 C470 566, 330 556, 212 564 Z"
          fill="#000" opacity="0.35" filter="url(#soft)"/>

    <!-- pennant hanging from the tube -->
    <path d="M330 540 L330 740 L410 690 L490 740 L490 540 Z" fill="url(#pennant)"/>
    <path d="M330 540 L330 740 L410 690 L490 740 L490 540 Z" fill="none" stroke="#1e1e2e" stroke-width="10" stroke-linejoin="round"/>
    <!-- fold line on the pennant -->
    <path d="M410 548 L410 690" stroke="#5fa85e" stroke-width="8" opacity="0.6"/>

    <!-- tube, gently curved -->
    <path d="M200 476 C320 462, 440 470, 560 486 C650 420, 740 356, 800 352
             L800 672
             C740 668, 650 604, 560 538 C440 554, 320 562, 200 548 Z"
          fill="url(#tube)"/>
    <!-- bell overlay with its own gradient -->
    <path d="M560 486 C650 420, 740 356, 800 352 L800 672 C740 668, 650 604, 560 538 Z" fill="url(#bell)"/>
    <!-- specular highlight along the top of the tube -->
    <path d="M214 486 C330 474, 440 482, 556 496" fill="none" stroke="#e6f0ff" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <path d="M580 480 C660 424, 730 380, 782 372" fill="none" stroke="#e6f0ff" stroke-width="14" stroke-linecap="round" opacity="0.45"/>

    <!-- rings on the tube -->
    <rect x="276" y="458" width="34" height="100" rx="14" fill="#cfe0ff"/>
    <rect x="276" y="458" width="34" height="100" rx="14" fill="none" stroke="#5c8ad8" stroke-width="6"/>
    <rect x="512" y="456" width="34" height="106" rx="14" fill="#cfe0ff"/>
    <rect x="512" y="456" width="34" height="106" rx="14" fill="none" stroke="#5c8ad8" stroke-width="6"/>

    <!-- mouthpiece -->
    <rect x="150" y="470" width="70" height="80" rx="32" fill="url(#tube)"/>
    <rect x="150" y="470" width="70" height="80" rx="32" fill="none" stroke="#5c8ad8" stroke-width="6"/>

    <!-- bell mouth -->
    <ellipse cx="800" cy="512" rx="44" ry="168" fill="url(#mouth)"/>
    <ellipse cx="800" cy="512" rx="44" ry="168" fill="none" stroke="#b4e3ff" stroke-width="16"/>
    <ellipse cx="800" cy="512" rx="30" ry="150" fill="none" stroke="#74c7ec" stroke-width="4" opacity="0.6"/>

    <!-- sound waves: three arcs, fading out -->
    <g fill="none" stroke="#a6e3a1" stroke-linecap="round">
      <path d="M876 442 C902 486, 902 538, 876 582" stroke-width="34"/>
      <path d="M930 396 C972 466, 972 558, 930 628" stroke-width="30" opacity="0.6"/>
      <path d="M980 350 C1040 450, 1040 574, 980 674" stroke-width="26" opacity="0.3"/>
    </g>
  </g>
</svg>
